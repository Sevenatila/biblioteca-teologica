<script src="/js/track.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo:#3A0E20;
    --vinho:#57152F;
    --vinho-claro:#6E1F3E;
    --pergaminho:#F3ECDA;
    --creme:#FAF6EA;
    --ouro:#C9A44A;
    --ouro-claro:#E7CE8C;
    --tinta:#2B1220;
    --verde:#3E6B4F;
    --erro:#8C2F39;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Lora',serif;
    background:var(--bordo);
    background-image:radial-gradient(ellipse at 50% -10%, #5c1a35 0%, var(--bordo) 55%);
    color:var(--tinta);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .topbar{
    width:100%;
    padding:14px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    color:var(--pergaminho);
    font-family:'Playfair Display',serif;
    font-weight:700;
    letter-spacing:.12em;
    font-size:13px;
    text-transform:uppercase;
    border-bottom:1px solid rgba(201,164,74,.25);
  }
  .topbar .cross{color:var(--ouro)}
  .stage{
    width:100%;
    max-width:560px;
    padding:22px 16px 48px;
    flex:1;
  }
  /* progresso */
  .progress{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .prog-label{
    font-family:'Playfair Display',serif;
    color:var(--ouro-claro);
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
  }
  .prog-track{
    flex:1;
    height:3px;
    background:rgba(243,236,218,.18);
    margin-left:14px;
    border-radius:2px;
    overflow:hidden;
  }
  .prog-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--ouro),var(--ouro-claro));
    transition:width .45s ease;
  }
  /* cartão */
  .card{
    background:var(--creme);
    border-radius:10px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    overflow:hidden;
    animation:rise .4s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
  .card-head{
    background:var(--pergaminho);
    padding:18px 22px 14px;
    border-bottom:1px solid rgba(58,14,32,.12);
    text-align:center;
  }
  .roman{
    font-family:'Playfair Display',serif;
    color:var(--ouro);
    font-weight:700;
    font-size:14px;
    letter-spacing:.25em;
  }
  .question{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:21px;
    line-height:1.35;
    color:var(--bordo);
    margin-top:6px;
  }
  .card-body{padding:18px 18px 22px}
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid rgba(58,14,32,.18);
    border-left:4px solid var(--vinho);
    border-radius:6px;
    padding:14px 14px;
    margin-bottom:10px;
    font-family:'Lora',serif;
    font-size:15.5px;
    color:var(--tinta);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .opt:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(58,14,32,.12)}
  .opt .letter{
    font-family:'Playfair Display',serif;
    font-weight:700;
    color:var(--vinho);
    min-width:20px;
  }
  .opt.locked{pointer-events:none;opacity:.55}
  .opt.correct{
    border-color:var(--verde);
    border-left-color:var(--verde);
    background:#eef4ee;
    opacity:1;
  }
  .opt.correct .letter{color:var(--verde)}
  .opt.wrong{
    border-color:var(--erro);
    border-left-color:var(--erro);
    background:#f7ecec;
    opacity:1;
  }
  .opt.wrong .letter{color:var(--erro)}
  .verdict{
    display:none;
    margin-top:6px;
    animation:rise .35s ease;
  }
  .verdict.show{display:block}
  .verdict-tag{
    font-family:'Playfair Display',serif;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12.5px;
    margin-bottom:8px;
  }
  .verdict-tag.ok{color:var(--verde)}
  .verdict-tag.no{color:var(--erro)}
  .explain{
    background:var(--pergaminho);
    border-left:3px solid var(--ouro);
    border-radius:0 6px 6px 0;
    padding:13px 15px;
    font-size:14.5px;
    line-height:1.55;
  }
  .explain b{color:var(--vinho)}
  .explain .src{
    display:block;
    margin-top:8px;
    font-style:italic;
    font-size:12.5px;
    color:var(--vinho);
    letter-spacing:.04em;
  }
  .btn{
    display:block;
    width:100%;
    margin-top:16px;
    background:var(--ouro);
    color:var(--bordo);
    border:none;
    border-radius:8px;
    padding:16px 18px;
    font-family:'Playfair Display',serif;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-size:14px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn:hover{background:#D4B15C}
  .btn:active{background:#B8933F}
  .btn:focus-visible{outline:3px solid var(--ouro-claro);outline-offset:2px}
  .btn.ghost{
    background:none;
    color:var(--vinho);
    font-family:'Lora',serif;
    text-transform:none;
    letter-spacing:0;
    font-weight:600;
    font-size:13.5px;
    padding:8px;
    margin-top:6px;
    text-decoration:underline;
  }
  .btn.ghost:hover,.btn.ghost:active{background:none}
  /* barra de avanço — o botão de próxima pergunta nascia depois da explicação,
     ou seja, fora da dobra no celular: quem respondia precisava rolar pra
     continuar. Agora ele vive fixo no rodapé e aparece junto com o veredito. */
  .next-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:50;
    display:flex;
    justify-content:center;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--bordo) 62%, rgba(58,14,32,0));
    transform:translateY(130%);
    transition:transform .28s ease;
    pointer-events:none;
  }
  .next-bar.show{transform:none;pointer-events:auto}
  .next-bar .btn{
    width:100%;
    max-width:528px;
    margin-top:0;
    box-shadow:0 8px 26px rgba(0,0,0,.45);
  }
  /* espaço pra barra não cobrir o fim da explicação */
  body.next-on .stage{padding-bottom:112px}
  /* captura */
  .center{text-align:center}
  .calc-title{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:22px;
    color:var(--bordo);
  }
  .calc-sub{font-size:14.5px;margin-top:8px;color:#5a3a47}
  .field{
    width:100%;
    margin-top:16px;
    padding:14px;
    border:1px solid rgba(58,14,32,.25);
    border-radius:6px;
    font-family:'Lora',serif;
    font-size:15px;
    background:#fff;
  }
  .field:focus{outline:2px solid var(--ouro)}
  .dots{
    font-family:'Playfair Display',serif;
    color:var(--ouro);
    font-size:26px;
    letter-spacing:.3em;
    margin:10px 0 4px;
  }
  /* resultado */
  .score-eyebrow{
    font-family:'Playfair Display',serif;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--ouro);
  }
  .score-big{
    font-family:'Playfair Display',serif;
    font-weight:800;
    font-size:56px;
    color:var(--bordo);
    line-height:1;
    margin:10px 0 4px;
  }
  .score-big small{font-size:22px;color:#7a5a68;font-weight:600}
  .band-title{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-style:italic;
    font-size:20px;
    line-height:1.35;
    color:var(--vinho);
    margin-top:8px;
    padding:0 6px;
  }
  .diag{
    text-align:left;
    margin-top:22px;
    font-size:15px;
    line-height:1.7;
    color:#4a2a3a;
  }
  .myths{
    text-align:left;
    margin-top:20px;
    background:var(--pergaminho);
    border-radius:8px;
    padding:16px 18px;
  }
  .myths h4{
    font-family:'Playfair Display',serif;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--vinho);
    margin-bottom:8px;
  }
  .myths span{
    display:inline-block;
    background:#fff;
    border:1px solid rgba(58,14,32,.15);
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;
    margin:4px 4px 0 0;
    color:var(--tinta);
  }
  .offer{
    margin-top:28px;
    background:var(--bordo);
    border-radius:8px;
    overflow:hidden;
    color:var(--pergaminho);
    text-align:center;
  }

    position:relative;

  .guarantee{
    display:flex;
    gap:16px;
    align-items:center;
    text-align:left;
    background:rgba(243,236,218,.07);
    border:1px solid rgba(201,164,74,.4);
    border-radius:10px;
    padding:18px;
    margin-top:28px;
  }
  /* Selo desenhado em SVG, não imagem: pesa ~1KB, fica nítido em qualquer
     tela e não depende de requisição — a garantia é o último argumento antes
     do botão, não pode aparecer depois do resto. */
  .g-seal{
    width:92px;height:92px;
    flex-shrink:0;
    display:block;
  }
  .g-seal .seal-line{fill:none;stroke:var(--ouro)}
  .g-seal text{
    font-family:'Playfair Display',serif;
    fill:var(--ouro-claro);
    text-anchor:middle;
  }
  .g-seal .seal-num{font-size:38px;font-weight:800;fill:var(--ouro-claro)}
  .g-seal .seal-dias{font-size:12.5px;font-weight:700;letter-spacing:.24em;fill:var(--ouro)}
  /* 7.8px + 0.05em ocupa ~4/5 do arco: o texto fica na parte alta da curva,
     sem escorrer pras laterais onde as letras saem quase deitadas. */
  .g-seal .seal-arco{font-size:7.4px;font-weight:700;letter-spacing:.05em;fill:var(--ouro)}
  @media (max-width:400px){
    .guarantee{gap:12px;padding:16px 14px}
    .g-seal{width:76px;height:76px}
  }
  .guarantee h4{
    font-family:'Playfair Display',serif;
    font-size:15px;
    color:var(--ouro-claro);
    margin-bottom:3px;
  }
  .guarantee p{font-size:13.5px;line-height:1.6;opacity:.92}

  .faq h4{

    margin-bottom:14px;

  .faq details{
    background:rgba(243,236,218,.06);
    border:1px solid rgba(243,236,218,.14);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
    transition:background .15s ease;
  }
  .faq details[open]{background:rgba(243,236,218,.1)}
  .faq summary{
    cursor:pointer;
    padding:15px 16px;
    min-height:48px;
    display:flex;
    align-items:center;
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:14px;
    color:var(--pergaminho);
    list-style:none;
    position:relative;
    padding-right:40px;
  }
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{
    content:"+";
    position:absolute;
    right:16px;top:50%;
    transform:translateY(-50%);
    color:var(--ouro);
    font-size:18px;
    font-family:'Lora',serif;
  }
  .faq details[open] summary::after{content:"–"}
  .faq details p{
    padding:2px 16px 15px;
    font-size:14px;
    line-height:1.6;
    opacity:.9;
  }
  .offer .btn{margin-top:22px}

const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
let current = 0;
let score = 0;
let missed = [];
const stage = document.getElementById('stage');

function renderQuestion(){
  const item = QUESTIONS[current];
  stage.innerHTML = `
    <div class="progress">
      <div class="prog-label">Pergunta ${ROMAN[current]} de X</div>
      <div class="prog-track"><div class="prog-fill" id="fill"></div></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="roman">— ${ROMAN[current]} —</div>
        <div class="question">${item.q}</div>
      </div>
      <div class="card-body">
        ${item.opts.map((o,i)=>`
          <button class="opt" data-i="${i}" onclick="answer(${i})">
            <span class="letter">${String.fromCharCode(97+i)})</span> ${o}
          </button>`).join('')}
        <div class="verdict" id="verdict">
          <div class="verdict-tag" id="vtag"></div>
          <div class="explain">${item.exp}<span class="src">✠ ${item.src}</span></div>
        </div>
      </div>
    </div>`;
  esconderAvancar();
  requestAnimationFrame(()=>{ 
    document.getElementById('fill').style.width = ((current)/QUESTIONS.length*100)+'%';
    requestAnimationFrame(()=>{ document.getElementById('fill').style.width = ((current+1)/QUESTIONS.length*100)+'%'; });
  });
  window.scrollTo({top:0});
}

function answer(i){
  const item = QUESTIONS[current];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o=>o.classList.add('locked'));
  opts[item.ans].classList.add('correct');
  const hit = (i===item.ans);
  if(hit){ score++; } else { opts[i].classList.add('wrong'); missed.push(item.tag); }
  const vtag = document.getElementById('vtag');
  vtag.textContent = hit ? '✓ Você acertou' : '✗ Você caiu neste mito';
  vtag.className = 'verdict-tag ' + (hit?'ok':'no');
  document.getElementById('verdict').classList.add('show');
  mostrarAvancar();
  rolarAteExplicacao();
  window.BT && BT.resposta(current+1, hit, item.tag);
}

function mostrarAvancar(){
  document.getElementById('nextBtn').textContent =
    current === QUESTIONS.length-1 ? 'Ver meu resultado' : 'Próxima pergunta';
  document.getElementById('nextBar').classList.add('show');
  document.body.classList.add('next-on');
}

function esconderAvancar(){
  document.getElementById('nextBar').classList.remove('show');
  document.body.classList.remove('next-on');
}

// Rola só o necessário pra explicação inteira caber acima da barra fixa —
// nunca pra baixo do que já está visível, senão a pergunta some da tela.
function rolarAteExplicacao(){
  requestAnimationFrame(()=>{
    const v = document.getElementById('verdict');
    if(!v) return;
    const alvo = v.getBoundingClientRect().bottom + window.scrollY - window.innerHeight + 116;
    if(alvo <= window.scrollY) return;
    const lento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({top:alvo, behavior: lento ? 'auto' : 'smooth'});
  });
}

function next(){
  current++;
  esconderAvancar();
  if(current < QUESTIONS.length){ renderQuestion(); }
  else { renderCapture(); }
}

// `n` é o número da faixa (1 a 4). O painel corta o mapa de calor por ele:
// cada faixa vê um título e um diagnóstico diferentes, ou seja, uma página
// diferente — somar as quatro num mapa só embaralharia as alturas.
function band(s){
  if(s<=3) return {
    n:1,
    t:"Você estuda por ouvir dizer",
    d:`Você caiu em <b>${10-s} dos 10 mitos</b> — e isso não é falta de fé, é falta de fonte. Quase tudo que você “sabe” sobre a Bíblia veio de sermões, músicas e tradição, não do texto. A boa notícia: essa é a lacuna mais rápida de corrigir quando se estuda com material sério.`
  };
  if(s<=6) return {
    n:2,
    t:"Você conhece as histórias, mas repete os mitos",
    d:`Você acertou o essencial, mas caiu em <b>${10-s} mitos</b> que repetia como verdade bíblica. Esse é exatamente o perfil dos 90%: conhece a Bíblia de ouvir falar, não de estudar na fonte. É o tipo de erro que só estudo sistemático corrige.`
  };
  if(s<=8) return {
    n:3,
    t:"Você estuda de verdade — mas ainda tem pontos cegos",
    d:`${10-s===1?'Apenas <b>1 mito</b> te pegou':'Apenas <b>'+(10-s)+' mitos</b> te pegaram'} — você está acima da média. Mas repare: foram justamente os detalhes que exigem ir além da leitura devocional. É aí que comentários e teologia sistemática fazem diferença.`
  };
  return {
    n:4,
    t:"Você é a exceção — e sabe o valor de estudar na fonte",
    d:`${s===10?'<b>10 de 10.</b> Ninguém chega aqui por acaso':'<b>9 de 10.</b> Quase perfeito'} — você claramente estuda de verdade. E quem estuda assim sabe: o limite nunca é a vontade, é o <b>acesso ao material</b>. Comentários, teologia sistemática, sermões históricos.`
  };
}

const CHECKOUT = 'https://checkout.protocolotsr.shop/VCCL1O8SD6FH';

// Sai por aqui, não por window.location direto no onclick: o rastreio precisa
// de uma brecha pra despachar o lote antes de a aba trocar de página. 120ms é
// o bastante pro sendBeacon sair e é imperceptível pra quem clicou.
//
// O id da visita vai junto na URL. O checkout devolve esses parâmetros no
// webhook de venda (api/webhook-vega.js), e é assim que uma compra volta
// amarrada na sessão que a gerou — sem isso o painel para em "foi pro
// checkout" e nunca sabe quem comprou. Vai em três nomes porque cada gateway
// repassa por um: bt_sid é o nosso, sck e src são os que a maioria devolve.
function irParaCheckout(){
  let destino = CHECKOUT;
  try{
    const u = new URL(CHECKOUT);
    const sid = (window.BT && BT.sid) || sessionStorage.getItem('bt_sid');
    if(sid){ u.searchParams.set('bt_sid', sid); u.searchParams.set('sck', sid); u.searchParams.set('src', sid); }
    // A campanha segue junto: assim o relatório do gateway bate com o painel.
    const p = new URLSearchParams(location.search);
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k=>{
      const v = p.get(k); if(v) u.searchParams.set(k, v);
    });
    destino = u.toString();
  }catch(_){}
  setTimeout(()=>{ window.location.href = destino; }, 120);
}

// ── Modo mapa de calor ──────────────────────────────────────────────────────
// /Quiz/?hm=1&band=2 abre direto na tela de resultado, com uma nota simulada.
// É como o /painel consegue mostrar a última página dentro de um iframe: sem
// isso, ele teria que responder 10 perguntas pra chegar nela. O js/track.js
// se desliga sozinho aqui (está em iframe e tem hm=1 na URL), então este modo
// nunca gera dado falso.
(function(){
  const p = new URLSearchParams(location.search);
  if(p.get('hm') !== '1') return renderQuestion();

  const faixa = Math.min(4, Math.max(1, parseInt(p.get('band'),10) || 2));
  score = [2, 6, 8, 10][faixa-1];          // uma nota representativa da faixa
  missed = QUESTIONS.slice(0, 10-score).map(q=>q.tag);
  renderResult();
})();
